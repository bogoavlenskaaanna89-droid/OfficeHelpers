name: Build OfficeHelpers for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Package single EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --noconsole --name OfficeHelpers main.py
          if (!(Test-Path 'dist/OfficeHelpers.exe')) { throw 'EXE was not created' }

      - name: Upload OfficeHelpers.exe
        uses: actions/upload-artifact@v4
        with:
          name: OfficeHelpers-Windows
          path: dist/OfficeHelpers.exe
          if-no-files-found: error
          retention-days: 30
