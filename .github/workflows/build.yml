name: Build OfficeHelpers for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python on GitHub runner (not on user's PC)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check source and Qt imports
        shell: pwsh
        run: |
          python -m py_compile main.py
          python -c "from PyQt5.QtCore import QTimer; from PyQt5.QtGui import QPixmap; from PyQt5.QtWidgets import QApplication; print('Qt imports OK')"
          python -c "import main; print('OfficeHelpers module imports OK')"

      - name: Build main Windows EXE (single file, no console)
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --onefile --noconsole --name OfficeHelpers main.py
          if (!(Test-Path 'dist/OfficeHelpers.exe')) { throw 'EXE was not created' }

      - name: Build optional diagnostic Windows EXE (with console)
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --onefile --console --name OfficeHelpers-Diagnostic main.py
          if (!(Test-Path 'dist/OfficeHelpers-Diagnostic.exe')) { throw 'Diagnostic EXE was not created' }
          Write-Host "Diagnostic EXE was created; launch test will be performed on your computer."

      - name: Upload normal EXE
        uses: actions/upload-artifact@v4
        with:
          name: OfficeHelpers-Windows
          path: dist/OfficeHelpers.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload diagnostic EXE (only for troubleshooting)
        uses: actions/upload-artifact@v4
        with:
          name: OfficeHelpers-Diagnostic
          path: dist/OfficeHelpers-Diagnostic.exe
          if-no-files-found: error
          retention-days: 30
